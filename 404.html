<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>走错教室了 · 还我小说！</title>
    <meta http-equiv="refresh" content="1.2; url=/novel-heist/" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 30% 20%, rgba(200, 73, 56, 0.2), transparent 40rem),
          #14120f;
        color: #f4ead8;
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      }
      .card {
        width: min(560px, 100%);
        padding: 32px 30px 28px;
        border: 2px solid #f4ead8;
        background: rgba(244, 234, 216, 0.05);
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.4);
      }
      .kicker {
        margin: 0 0 10px;
        color: #f0c04e;
        font-size: 12px;
        letter-spacing: 0.18em;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(26px, 5vw, 38px);
        line-height: 1.15;
        font-weight: 500;
      }
      p {
        margin: 0 0 10px;
        color: #c9b9a2;
        font-size: 14px;
        line-height: 1.7;
      }
      a {
        color: #f0c04e;
        text-underline-offset: 3px;
      }
      .foot {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px dashed rgba(244, 234, 216, 0.3);
        font-size: 12px;
        color: #8f816e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="kicker">404 / 走错教室了</p>
      <h1>这间教室没有这本书。</h1>
      <p>地址里多了一点东西，页面没找到。正在把你送回晚自习现场。</p>
      <p><a id="home" href="/novel-heist/">没自动跳转的话，点这里回游戏</a></p>
      <p class="foot">还我小说！ · 晚自习特别行动</p>
    </main>
    <script>
      (function () {
        var home = '/novel-heist/';
        document.getElementById('home').setAttribute('href', home);
        window.setTimeout(function () {
          window.location.replace(home);
        }, 1200);
      })();
    </script>
  </body>
</html>
